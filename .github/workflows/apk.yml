name: APK

# A compilacao mora aqui, e nao na maquina de ninguem, porque o SDK do Android
# sao ~2 GB e uma instalacao a mais pra manter em dia. O runner do GitHub ja
# vem com ele; a gente so escolhe o Java e manda compilar.
on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # Debug, e assinado com a chave de debug do proprio Android. Da pra
      # instalar de lado sem cadastro nenhum; o que NAO da e publicar na Play
      # Store, que exigiria uma chave de release guardada em segredo.
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: vexis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
