name: APK

# A compilacao mora aqui, e nao na maquina de ninguem, porque o SDK do Android
# sao ~2 GB e uma instalacao a mais pra manter em dia. O runner do GitHub ja
# vem com ele; a gente so escolhe o Java e manda compilar.
on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # Debug, e assinado com a chave de debug do proprio Android. Da pra
      # instalar de lado sem cadastro nenhum; o que NAO da e publicar na Play
      # Store, que exigiria uma chave de release guardada em segredo.
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: vexis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # O artefato acima exige login no GitHub e vem dentro de um .zip — dois
      # passos ruins de fazer num celular. Um release da link DIRETO pro .apk,
      # e num repositorio publico ele abre sem login: da pra tocar no link e
      # instalar. A tag e fixa ("apk") de proposito: o endereco nunca muda,
      # entao o atalho que voce salvar continua valendo depois do proximo build.
      - name: Publicar pra baixar no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          NOTAS="APK de debug, montado a partir de ${GITHUB_SHA:0:7}.
          Instala de lado (o Android vai pedir pra permitir fonte desconhecida).
          Na primeira abertura ele pergunta o endereco do painel — o que o
          \`npm run hud\` mostra no terminal do PC."

          gh release view apk >/dev/null 2>&1 \
            || gh release create apk --title "VEXIS — app do celular" --notes "$NOTAS" --target "$GITHUB_SHA"
          gh release edit apk --notes "$NOTAS" --target "$GITHUB_SHA"
          gh release upload apk "$APK" --clobber

          echo "### APK pronto" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/apk/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
